<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The renderer container's fonts (docs/design.md, decision 24), installed
  as /etc/fonts/local.conf. Chromium draws sans-serif, serif and monospace
  with Liberation, whose metrics are those of Arial, Times New Roman and
  Courier New, but takes system-ui from fontconfig's default, which without
  this falls through to Liberation Mono. DejaVu only fills in characters
  Liberation lacks, such as check marks and arrows.
-->
<fontconfig>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Liberation Serif</family><family>DejaVu Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Liberation Mono</family><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
